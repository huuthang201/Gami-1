spring:
  application:
    name: daily-checkin
  datasource:
    url: jdbc:mysql://localhost:3306/checkin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: checkin
    password: checkin
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.format_sql: true
    open-in-view: false
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

app:
  timezone: Asia/Ho_Chi_Minh
  checkin:
    max-per-month: 7

logging:
  level:
    root: INFO
    com.example.dailycheckin: DEBUG